services:
  - type: web
    name: gameclip-publisher
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: GAMECLIP_API_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.12
